<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-label { display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #007bff; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .link-btn { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Teachers' Attendance</h2>
    <form id="attendanceForm">
        <div class="form-group">
            <label for="teacherName">Teacher Name</label>
            <select id="teacherName" required>
            <option value="">-- Select Teacher --</option> 
                <option value="Nuruddin sir">Nuruddin sir</option>
                <option value="Fatema madam">Fatema madam </option>
                <option value="Sony madam">Sony madam</option>
                <option value="Ripan sir">Ripan sir</option>  
                <option value="Alim sir">Alim sir</option> 
                <option value="Alamin sar">Alamin sir</option>   
                <option value="Ayrin madam">Ayrin madam</option>              
                <option value="Momotaz madan">Momotaz medam</option>
                <option value="Lucky madam">Lucky madam</option>
                <option value="Plaboni madam">Plabony madam  </option>  
                 <option value="Akram sir">Akram sir </option> 
                <option value="Mustakim sir">Mustakim sir</option>
                <option value="Dilruba madam">Dilruba madam</option>
                <option value="Habiba madam">Habiba madam</option>
                <option value="Atik sir">Atik sir</option>
                <option value="Mahfuz sir">Mahfuz sir  </option>
                <option value="kalam">kalam sir</option>
                <option value="Ajis sir">Ajis sir</option>
                
                </select>
        </div>

        <div class="form-group">
            <label for="attendanceDate">Date</label>
            <input type="date" id="attendanceDate" required>
        </div>
      <div class="form-group">
      <label>Departure time</label>
      <div class="radio-group">
      <label class="radio-label"><input type="radio" name="status" value="2:00" checked> 2:00</label>
      <label class="radio-label"><input type="radio" name="status" value="2:30"> 2:30</label>
      <label class="radio-label"><input type="radio" name="status" value="3:00"> 3:00</label>
      <label class="radio-label"><input type="radio" name="status" value="Break"> Break</label>
      
      </div>
      </div>
      <div class="form-group">
      <label>Missing class</label>
      <div class="radio-group">
      <label class="radio-label"><input type="radio" name="status1" value="0subject" checked>0subject</label>
      <label class="radio-label"><input type="radio" name="status1" value="1subject"> 1subject</label>
      <label class="radio-label"><input type="radio" name="status1" value="2subject"> 2subject</label>
      </div>
      </div>
        <button type="submit">Submit Attendance</button>
    </form>
    <a href="https://ripanabc.github.io/page/index12.html" target="_blank" class="link-btn">View Attendance Dashboard →</a>
</div>

<script>
    // Set today's date automatically as default
    document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('teacherName').value;
        const date = document.getElementById('attendanceDate').value;
        const status = document.querySelector('input[name="status"]:checked').value;
        const status1 = document.querySelector('input[name="status1"]:checked').value;
        
        const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        // Retrieve existing records or create empty array
        let records = JSON.parse(localStorage.getItem('attendanceRecords')) || [];

        // Save new record
        records.push({ name, date, status, status1, timestamp });
        localStorage.setItem('attendanceRecords', JSON.stringify(records));

        alert('Attendance submitted successfully!');
        this.reset();
        document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
    });
</script>

</bod>
</html>
