<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #333; }
        .clear-btn { padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .clear-btn:hover { background: #bd2130; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f8f9fa; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .Present { background: #d4edda; color: #155724; }
        .Absent { background: #f8d7da; color: #721c24; }
        .Late { background: #fff3cd; color: #856404; }
        .no-data { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>Teacher Attendance Records</h2>
        <button class="clear-btn" id="clearData">Clear All Records</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Teacher Name</th>
                <th>Date</th>
                <th>Submission Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="attendanceTableBody">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
    </table>
</div>

<script>
    function loadAttendance() {
        const tableBody = document.getElementById('attendanceTableBody');
        const records = JSON.parse(localStorage.getItem('attendanceRecords')) || [];

        tableBody.innerHTML = '';

        if (records.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" class="no-data">No attendance records found.</td></tr>';
            return;
        }

        // Display records from newest to oldest
        records.reverse().forEach(record => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${record.name}</strong></td>
                <td>${record.date}</td>
                <td>${record.timestamp}</td>
                <td><span class="badge ${record.status}">${record.status}</span></td>
            `;
            tableBody.appendChild(row);
        });
    }

    // Clear records logic
    document.getElementById('clearData').addEventListener('click', function() {
        if (confirm('Are you sure you want to clear all records?')) {
            localStorage.removeItem('attendanceRecords');
            loadAttendance();
        }
    });

    // Load data on page load
    window.onload = loadAttendance;

    // Optional: Refresh data if the user switches back to this browser tab
    window.addEventListener('focus', loadAttendance);
</script>

</body>
</html>
