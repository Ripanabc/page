<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 250px; }
        button { padding: 8px 15px; cursor: pointer; background: #007BFF; color: white; border: none; }
    </style>
</head>
<body>

    <h2>User Registration Form</h2>
    
    <!-- The HTML form with specific IDs -->
    <form id="userForm">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" required placeholder="Enter email">
        </div>
        <button type="submit">Submit Form</button>
    </form>

    <script>
        // Select the form element
        const form = document.getElementById('userForm');

        // Handle the submission event
        form.addEventListener('submit', function(event) {
            // Prevent standard form submission behavior (page reload)
            event.preventDefault();

            // Retrieve values from form fields
            const usernameValue = document.getElementById('username').value;
            const emailValue = document.getElementById('email').value;

            // Save variables to the browser's localStorage
            localStorage.setItem('storedUsername', usernameValue);
            localStorage.setItem('storedEmail', emailValue);

            // Redirect the user to the destination webpage
            window.location.href = 'display.html';
        });
    </script>

</body>
</html>
